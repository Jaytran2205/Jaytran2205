<svg viewBox="0 0 1920 600" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-50px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(50px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
      }
      
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      @keyframes twinkle {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      
      @keyframes pulse {
        0%, 100% { text-shadow: 0 0 10px rgba(88, 166, 255, 0.5); }
        50% { text-shadow: 0 0 30px rgba(88, 166, 255, 0.8); }
      }
      
      .background {
        fill: url(#bgGradient);
      }
      
      .main-title {
        font-size: 70px;
        font-weight: bold;
        fill: white;
        text-anchor: middle;
        font-family: 'Segoe UI', Arial, sans-serif;
        animation: slideDown 1s ease-out, pulse 2s ease-in-out 1s infinite;
        letter-spacing: 3px;
      }
      
      .subtitle {
        font-size: 36px;
        fill: #58a6ff;
        text-anchor: middle;
        font-family: 'Segoe UI', Arial, sans-serif;
        animation: slideUp 1s ease-out;
        letter-spacing: 2px;
        font-weight: 300;
      }
      
      .icon {
        font-size: 60px;
        text-anchor: middle;
        animation: float 3s ease-in-out infinite;
      }
      
      .icon1 { animation-delay: 0s; }
      .icon2 { animation-delay: 0.3s; }
      .icon3 { animation-delay: 0.6s; }
      .icon4 { animation-delay: 0.9s; }
      
      .star {
        fill: white;
        animation: twinkle 3s ease-in-out infinite;
      }
      
      .earth-group {
        animation: rotate 20s linear infinite;
        transform-origin: 1750px 450px;
      }
      
      .earth-circle {
        fill: url(#earthGradient);
        filter: drop-shadow(0 0 20px rgba(88, 166, 255, 0.5));
      }
      
      .continent {
        fill: #2d8659;
      }
    </style>
    
    <radialGradient id="bgGradient">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1629;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="earthGradient">
      <stop offset="0%" style="stop-color:#4da6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect class="background" width="1920" height="600"/>
  
  <!-- Stars -->
  <circle class="star" cx="100" cy="80" r="2" style="animation-delay: 0s;"/>
  <circle class="star" cx="250" cy="120" r="1.5" style="animation-delay: 0.3s;"/>
  <circle class="star" cx="450" cy="200" r="2" style="animation-delay: 0.6s;"/>
  <circle class="star" cx="600" cy="150" r="1" style="animation-delay: 0.9s;"/>
  <circle class="star" cx="800" cy="100" r="2" style="animation-delay: 1.2s;"/>
  <circle class="star" cx="1000" cy="180" r="1.5" style="animation-delay: 1.5s;"/>
  <circle class="star" cx="1200" cy="120" r="2" style="animation-delay: 1.8s;"/>
  <circle class="star" cx="1400" cy="200" r="1" style="animation-delay: 0.3s;"/>
  <circle class="star" cx="1600" cy="150" r="2" style="animation-delay: 0.7s;"/>
  <circle class="star" cx="1800" cy="100" r="1.5" style="animation-delay: 1s;"/>
  
  <circle class="star" cx="150" cy="500" r="1.5" style="animation-delay: 0.5s;"/>
  <circle class="star" cx="400" cy="480" r="2" style="animation-delay: 0.8s;"/>
  <circle class="star" cx="700" cy="520" r="1" style="animation-delay: 1.1s;"/>
  <circle class="star" cx="950" cy="490" r="2" style="animation-delay: 1.4s;"/>
  <circle class="star" cx="1300" cy="510" r="1.5" style="animation-delay: 1.7s;"/>
  <circle class="star" cx="1650" cy="470" r="2" style="animation-delay: 0.2s;"/>
  
  <circle class="star" cx="350" cy="300" r="1" style="animation-delay: 0.4s;"/>
  <circle class="star" cx="650" cy="320" r="1.5" style="animation-delay: 0.7s;"/>
  <circle class="star" cx="1100" cy="350" r="2" style="animation-delay: 1.3s;"/>
  <circle class="star" cx="1500" cy="300" r="1" style="animation-delay: 0.6s;"/>
  
  <!-- Earth Group -->
  <g class="earth-group">
    <circle class="earth-circle" cx="1750" cy="450" r="75"/>
    
    <!-- Continents -->
    <ellipse class="continent" cx="1710" cy="420" rx="25" ry="30" transform="rotate(-17 1710 420)"/>
    <ellipse class="continent" cx="1705" cy="470" rx="15" ry="20" transform="rotate(-12 1705 470)"/>
    <ellipse class="continent" cx="1765" cy="430" rx="20" ry="35" transform="rotate(6 1765 430)"/>
    <ellipse class="continent" cx="1785" cy="435" rx="30" ry="25" transform="rotate(11 1785 435)"/>
    <ellipse class="continent" cx="1795" cy="475" rx="12" ry="15" transform="rotate(0 1795 475)"/>
    
    <!-- Earth glow -->
    <circle cx="1750" cy="450" r="75" fill="none" stroke="rgba(88, 166, 255, 0.6)" stroke-width="2"/>
  </g>
  
  <!-- Main Content -->
  <text class="main-title" x="960" y="200">HELLO, I'M JAYDEV2205 FROM THE EARTH 🌍</text>
  
  <text class="subtitle" x="960" y="280">Student Developer | Cybersecurity Enthusiast</text>
  
  <!-- Icons -->
  <text class="icon icon1" x="820" y="370">🛡️</text>
  <text class="icon icon2" x="920" y="370">🔐</text>
  <text class="icon icon3" x="1020" y="370">🐛</text>
  <text class="icon icon4" x="1120" y="370">⚠️</text>
</svg>
